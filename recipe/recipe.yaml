schema_version: 1

context:
  version: "28.5.0"

package:
  name: dragon-ml-toolbox
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/d/dragon-ml-toolbox/dragon_ml_toolbox-${{ version }}.tar.gz
  sha256: 82368ae45629af1a05670fbbeab0959b2414d4c2524f813007a72a075af9306f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.12,<3.15
    - setuptools >=61.0
    - pip
  run:
    - python >=3.12,<3.15
    - numpy >=2.0
    - pandas >=3.0
    - polars >=2.0
    - pyarrow
    - joblib
    - colorlog

tests:
  - python:
      imports:
        - dragon
      pip_check: true

about:
  summary: Complete pipelines and helper tools for data science and machine learning projects.
  license: MIT
  license_file:
    - LICENSE
    - LICENSE-THIRD-PARTY.md
  homepage: https://github.com/DrAg0n-BoRn/ML_tools

extra:
  recipe-maintainers:
    - DrAg0n-BoRn
